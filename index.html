```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangunin Pacar ❤️</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        overflow: hidden;
        background: linear-gradient(180deg, #17172b, #30234d);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 2s ease;
    }

    /* =========================
       BACKGROUND
    ========================== */
    body.pagi {
        background: linear-gradient(
            180deg,
            #87ceeb 0%,
            #bdefff 50%,
            #fff1c1 100%
        );
    }

    .container {
        width: 90%;
        max-width: 600px;
        text-align: center;
        position: relative;
        z-index: 10;
    }

    /* =========================
       BULAN
    ========================== */
    .moon {
        position: fixed;
        top: 70px;
        right: 12%;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #fff7c7;
        box-shadow: 0 0 30px rgba(255,255,200,0.7);
        transition: all 2s ease;
    }

    body.pagi .moon {
        opacity: 0;
        transform: translateY(-100px);
    }

    /* =========================
       MATAHARI
    ========================== */
    .sun {
        position: fixed;
        bottom: -150px;
        left: 50%;
        transform: translateX(-50%);
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: #ffd166;
        box-shadow: 0 0 60px #ffd166;
        transition: all 2.5s ease;
    }

    body.pagi .sun {
        bottom: 65%;
    }

    /* =========================
       CARD
    ========================== */
    .card {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(12px);
        padding: 40px 25px;
        border-radius: 30px;
        box-shadow: 0 15px 50px rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.15);
        transition: all 0.8s ease;
    }

    body.pagi .card {
        background: rgba(255,255,255,0.28);
        color: #4a3040;
    }

    /* =========================
       JAM
    ========================== */
    .clock {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 15px;
    }

    /* =========================
       EMOJI
    ========================== */
    .emoji {
        font-size: 80px;
        margin-bottom: 15px;
        animation: tidur 2s infinite ease-in-out;
    }

    @keyframes tidur {
        0%,100% {
            transform: translateY(0) rotate(-3deg);
        }

        50% {
            transform: translateY(-10px) rotate(3deg);
        }
    }

    /* =========================
       TEXT
    ========================== */
    h1 {
        font-size: 34px;
        margin-bottom: 15px;
    }

    .message {
        min-height: 70px;
        font-size: 18px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    /* =========================
       BUTTON
    ========================== */
    button {
        border: none;
        padding: 15px 28px;
        border-radius: 50px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        background: #ff4d6d;
        color: white;
        box-shadow: 0 8px 20px rgba(255,77,109,0.4);
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 30px rgba(255,77,109,0.6);
    }

    button:active {
        transform: scale(0.95);
    }

    /* =========================
       HATI
    ========================== */
    .heart {
        position: fixed;
        bottom: -50px;
        font-size: 25px;
        pointer-events: none;
        animation: naik linear forwards;
        z-index: 20;
    }

    @keyframes naik {
        0% {
            transform: translateY(0) scale(0.5) rotate(0);
            opacity: 0;
        }

        20% {
            opacity: 1;
        }

        100% {
            transform: translateY(-110vh) scale(1.5) rotate(360deg);
            opacity: 0;
        }
    }

    /* =========================
       BINTANG
    ========================== */
    .star {
        position: fixed;
        color: white;
        animation: kelapkelip 2s infinite alternate;
    }

    @keyframes kelapkelip {
        from {
            opacity: 0.2;
            transform: scale(0.7);
        }

        to {
            opacity: 1;
            transform: scale(1.2);
        }
    }

    /* =========================
       TYPING
    ========================== */
    .cursor {
        animation: kedip 0.7s infinite;
    }

    @keyframes kedip {
        50% {
            opacity: 0;
        }
    }

    /* =========================
       FOOTER
    ========================== */
    .footer {
        margin-top: 20px;
        font-size: 13px;
        opacity: 0.7;
    }

    /* =========================
       RESPONSIVE
    ========================== */
    @media (max-width: 500px) {
        h1 {
            font-size: 27px;
        }

        .emoji {
            font-size: 65px;
        }

        .message {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<!-- Bulan -->
<div class="moon"></div>

<!-- Matahari -->
<div class="sun"></div>

<!-- Bintang -->
<div class="stars"></div>

<div class="container">

    <div class="card">

        <div class="clock" id="clock">
            00:00:00
        </div>

        <div class="emoji" id="emoji">
            😴
        </div>

        <h1 id="title">
            BANGUNNN mimikuuuuuuu😭
        </h1>

        <div class="message" id="message">
            <span id="typing"></span>
            <span class="cursor">|</span>
        </div>

        <button id="wakeButton">
            😴 pencettt
        </button>

        <div class="footer">
            Dibuatt khususs for kekasihkuuu ❤️
        </div>

    </div>

</div>

<script>

    /* =================================
       JAM DIGITAL
    ================================= */

    function updateClock() {

        const now = new Date();

        let jam = String(now.getHours()).padStart(2, "0");
        let menit = String(now.getMinutes()).padStart(2, "0");
        let detik = String(now.getSeconds()).padStart(2, "0");

        document.getElementById("clock").textContent =
            `${jam}:${menit}:${detik}`;
    }

    updateClock();

    setInterval(updateClock, 1000);


    /* =================================
       BINTANG
    ================================= */

    const starsContainer =
        document.querySelector(".stars");

    for (let i = 0; i < 45; i++) {

        const star = document.createElement("div");

        star.className = "star";

        star.innerHTML = "✦";

        star.style.left =
            Math.random() * 100 + "%";

        star.style.top =
            Math.random() * 70 + "%";

        star.style.fontSize =
            (Math.random() * 10 + 5) + "px";

        star.style.animationDelay =
            Math.random() * 2 + "s";

        starsContainer.appendChild(star);
    }


    /* =================================
       TYPING EFFECT
    ================================= */

    const messages = [
        "Bangun sayanggg... mataharinya so naikkk inii hehehe ☀️",
        "❤️",
        "❤️",
        "",
        "Selamattt pagiii manusiaa kesayanganku ❤️",
        "Semoga harii inii kitaaa mendapatkan banyak hal baik",
        "Semoga hari ini kitaaa mendapatkannn baanyak hall baikk"
    ];

    let messageIndex = 0;
    let charIndex = 0;
    let deleting = false;

    const typingElement =
        document.getElementById("typing");

    function typingEffect() {

        const current =
            messages[messageIndex];

        if (!deleting) {

            typingElement.textContent =
                current.substring(0, charIndex + 1);

            charIndex++;

            if (charIndex === current.length) {

                deleting = true;

                setTimeout(typingEffect, 2500);
                return;
            }

        } else {

            typingElement.textContent =
                current.substring(0, charIndex - 1);

            charIndex--;

            if (charIndex === 0) {

                deleting = false;

                messageIndex++;

                if (messageIndex >= messages.length) {
                    messageIndex = 0;
                }
            }
        }

        setTimeout(
            typingEffect,
            deleting ? 40 : 70
        );
    }

    typingEffect();


    /* =================================
       TOMBOL BANGUN
    ================================= */

    const button =
        document.getElementById("wakeButton");

    const title =
        document.getElementById("title");

    const emoji =
        document.getElementById("emoji");

    let clicked = false;

    button.addEventListener("click", function () {

        if (!clicked) {

            clicked = true;

            document.body.classList.add("pagi");

            emoji.textContent = "🥰";

            title.textContent =
                "PAGIII SAYANGGG ❤️";

            button.textContent =
                "☀️ Cwomuuu Sudah Bangun yaahhhhh ";

            createHearts(25);

            typingElement.textContent =
                "Akhirnyaaaa bangunn leeee 😭❤️!";

        } else {

            emoji.textContent = "😘";

            title.textContent =
                "Semangatt For mimikuu sayangg iniiiii❤️";

            typingElement.textContent =
                "Harii iniiii banyak hal baik ketemu kitaa yaaahhhhh sayanggg ❤️";

            createHearts(15);
        }

    });


    /* =================================
       ANIMASI HATI
    ================================= */

    function createHearts(jumlah) {

        for (let i = 0; i < jumlah; i++) {

            setTimeout(() => {

                const heart =
                    document.createElement("div");

                heart.className = "heart";

                const heartList = [
                    "❤️",
                    "💕",
                    "💗",
                    "💖",
                    "💓",
                    "💘"
                ];

                heart.textContent =
                    heartList[
                        Math.floor(
                            Math.random() *
                            heartList.length
                        )
                    ];

                heart.style.left =
                    Math.random() * 100 + "%";

                heart.style.animationDuration =
                    (Math.random() * 3 + 3) + "s";

                heart.style.fontSize =
                    (Math.random() * 20 + 20) + "px";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);

            }, i * 100);
        }
    }


    /* =================================
       AUTO HEART RANDOM
    ================================= */

    setInterval(() => {

        if (clicked) {

            createHearts(1);

        }

    }, 2500);


    /* =================================
       EFEK KLIK DI LAYAR
    ================================= */

    document.addEventListener("click", function(e) {

        if (e.target === button) return;

        const heart =
            document.createElement("div");

        heart.className = "heart";

        heart.textContent = "❤️";

        heart.style.left =
            e.clientX + "px";

        heart.style.bottom =
            (window.innerHeight - e.clientY) + "px";

        heart.style.animationDuration = "2s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 2000);

    });

</script>

</body>
</html>
```
